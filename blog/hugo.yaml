baseURL: https://jarx64.com/blog/
languageCode: en-us
title: Jahangir Alam Rocky
theme: PaperMod
pagination:
  pagerSize: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
publishDir: ../dist/blog

params:
  env: production
  title: Jahangir Alam Rocky
  keywords: [Blog, Portfolio]
  author: Jahangir Alam Rocky
  images: []
  dateFormat: "January 2, 2006"
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  comments: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "/blog/favicon.png"
    favicon16x16: "/blog/favicon.png"
    favicon32x32: "/blog/favicon.png"
    apple_touch_icon: "/blog/favicon.png"
    safari_pinned_tab: "/blog/favicon.png"

  label:
    text: "~/"

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to my blog. Here, I document my experiments and discoveries to serve as a reference for the future. Feel free to reach out if any of the topics interest you

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/jahangir1x"
    - name: github
      url: "https://github.com/jarx64"
    - name: email
      url: "mailto:jahangir64r@gmail.com"
    - name: facebook
      url: "https://facebook.com/jarx64"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # editPost:
    # URL: "https://github.com/jahangir1x/jahangir1x.github.io/_src_blog/content"
    # Text: "Suggest Changes" # edit text
    # appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: blog
      name: ~/blog
      url: /
      weight: 10
    - identifier: categories
      name: ./categories
      url: /categories/
      weight: 20
    - identifier: tags
      name: ./tags
      url: /tags/
      weight: 30
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

services:
  disqus:
    shortname: jarx64